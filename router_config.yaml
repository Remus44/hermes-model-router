enabled: true
# These are the shipped defaults. Put your own settings in router_config.local.yaml
# beside this file: it is git-ignored, layered over this one key by key, and it is
# where the dashboard saves.
provider: openai-codex
models:
  luna: gpt-6-luna
  spark: gpt-5.3-codex-spark
  terra: gpt-5.6-terra
  sol: gpt-6.1-sol
  qwen: qwen3.7-plus
  grok: grok-4.7
callable:
  luna: true
  spark: false
  terra: true
  sol: true
  # Needs a Claude subscription and login (the Claude Code login, which Hermes
  # borrows for the anthropic provider), then switch them on. Claude delegation
  # (delegate_claude) is offered exactly while at least one of these is on.
  opus5: false
  sonnet5: false
  haiku: false
  qwen: true
  # Needs a SuperGrok subscription: `hermes auth add xai-oauth --type oauth`, a
  # `delegation.targets.grok` entry in ~/.hermes/config.yaml, then switch it on.
  grok: false
# Preferred models per kind of work, best first. The router takes the first entry
# that is callable; if that entry is a Codex tier it becomes the route, and if it is
# an external account (opus5, sonnet5, qwen) it becomes a delegation recommendation
# to the conductor -- the router cannot rewrite a request's provider, only its model.
#
# A kind left out here keeps its built-in route. A kind listed here overrides that
# route completely, including the safety defaults (design/sensitive/critical), so
# the order you write is the order that applies.
preferences: {}
# An example spreading work over both accounts, with the Claude models on. An
# entry that is switched off is skipped; a list with nothing callable left falls
# back to the built-in route:
#  design:    [sol, opus5]
#  code:      [terra, sonnet5]
#  explore:   [spark, luna, haiku]
#  review:    [sonnet5, opus5, terra]
#  sensitive: [opus5, sol]
#  critical:  [opus5, sol]
#  long:      [sol, sonnet5]
# Another ordering:
#  design:    [sol, opus5, terra]
#  code:      [terra, sol]
#  explore:   [spark, luna, qwen]
#  review:    [sonnet5, opus5, terra]
#  sensitive: [sol, opus5]
#  critical:  [sol, opus5]
#  long:      [sol, opus5]
#  chat:      [luna, spark]
#  default:   [terra]

fallbacks:
  spark: luna
  luna: terra
  sol: terra
  opus5: sol
  qwen: terra
  grok: terra
default_model: qwen
# Claude Code CLI bridge only, not `delegate_claude`: these settings govern the
# subprocess path that runs `claude -p` in `default_repo` (or a configured alias).
# The bridge's project/runtime behaviour is owned by the installed Claude Code CLI;
# `claude_delegation` below instead starts ordinary Hermes provider children.
coding_agent:
  enabled: false
  tier: opus5
  requested_alias: opus
  canonical_model: claude-opus-5-5
  default_repo: /home/deepwell/booking-saas
  max_turns: 8
  max_budget_usd: 5.0
  timeout_seconds: 300
  lifecycle_path: ~/.hermes/logs/claude-code-bridge.jsonl
  explicit_ui:
    enabled: true
    max_chars: 1200
    require_recent_verified_probe_seconds: 86400
  reviewer:
    enabled: true
    max_chars: 8000
  delegated_review:
    enabled: true
    # Reviews need more inspection turns than bounded coding tasks; they do not inherit max_turns above.
    max_turns: 16
    max_chars: 8000
    models:
    - opus
    - sonnet
  repo_aliases:
    model router: /home/deepwell/.hermes/plugins/model_router
    modelrouter: /home/deepwell/.hermes/plugins/model_router
    hermes-agent: /home/deepwell/.hermes/hermes-agent
    hermes agent: /home/deepwell/.hermes/hermes-agent
    booking-saas: /home/deepwell/booking-saas
    booking saas: /home/deepwell/booking-saas
    hermes: /home/deepwell/.hermes/hermes-agent
    booking: /home/deepwell/booking-saas
tier_providers:
  luna: openai-codex
  spark: openai-codex
  terra: openai-codex
  sol: openai-codex
  opus5: anthropic
  sonnet5: anthropic
  haiku: anthropic
  qwen: qwen-token
  grok: xai-oauth
thresholds:
  luna_max_chars: 700
  sol_min_chars: 3500
effort:
  luna: low
  spark: medium
  terra: medium
  sol: medium
  grok: medium
  opus5: external
  sol_long: medium
  explicit_sol: medium
  explicit_sol_xhigh: medium
  explicit_luna_xhigh: high
  explicit_spark_xhigh: high
  explicit_terra_xhigh: high
quota_fallbacks:
  spark:
    model: luna
    effort: medium
logging:
  enabled: true
  path: ~/.hermes/logs/model-router.jsonl
  prompt_preview_chars: 240
  redact_prompt_preview: true
session_policy:
  pin_root_parent: true
delegation:
  preserve_spark_subagents: true
# The parent triages every actionable user turn itself: its first call must be
# triage_task (solo or workers). Questions and short remarks skip it. While on,
# it replaces the forced conductor below and owns the turn's worker budget:
# max_workers_per_turn counts sub-workers too, each worker may start
# max_children_per_worker sub-workers, and a sub-worker never delegates.
triage:
  enabled: true
  max_workers_per_turn: 4
  max_children_per_worker: 1
  path: ~/.hermes/logs/model-router-triage.jsonl
orchestration:
  # Superseded by triage while that is on.
  enabled: true
  # The forced conductor runs on the parent's own tier (Grok plans on Grok,
  # Terra on Terra). Off: it uses default_model and its fallback chain, as
  # before 1.19.0. `conductor: <tier>` pins it outright and wins over both.
  conductor_follows_parent: true
  # min_chars gates a fresh short prompt only. A short follow-up ("do it" after a
  # discussed plan) is preflighted anyway, and the objective the parent writes for
  # the conductor decides: under min_goal_chars nothing is spawned.
  min_chars: 1000
  min_goal_chars: 500
  max_tasks: 2
  rescue_min_calls: 6
  path: ~/.hermes/logs/terra-spark-orchestration.jsonl
sol_opus5_preflight:
  enabled: false
  owner: sol
  bridge_model: claude-opus-5-5
  require_successful_auth_probe: true
peer_groups:
  heavy:
  - terra
  - opus5
  - grok
  - qwen
  - sonnet5
  light:
  - luna
  - spark
  - haiku
usage_report:
  enabled: true
  window_seconds: 3600
cooldown:
  enabled: true
  path: ~/.hermes/state/model-router-cooldowns.json
  quota_seconds: 900
  allowed_fails: 3
  failure_window_seconds: 60
  failure_seconds: 60
shadow:
  enabled: false
  limit: 0
  path: ~/.hermes/logs/spark-shadow-benchmark.jsonl

# Claude delegation: delegate_claude runs children on the anthropic provider through
# Hermes's own delegate_task. The guard reads Anthropic's weekly usage: from
# soft_percent opus work steps down to sonnet, and from hard_percent delegate_claude
# refuses and names a Codex tier instead.
claude_delegation:
  tiers:
    haiku: claude-haiku-4-5-20251001
    sonnet: claude-sonnet-5-5
    opus: claude-opus-5-5
  default_tier: sonnet
  log_path: ~/.hermes/logs/claude-delegation.jsonl
  # reasoning_effort:
  #   sonnet: medium
  #   opus: medium

# Weekly usage guard, the same for every delegation account. From soft_percent the
# account's heaviest tier steps down (step_down, router target names); from
# hard_percent weekly or 5-hour usage, delegation to it is closed. The dashboard
# reads state_path and never polls the usage endpoints itself.
usage_guard:
  cache_seconds: 300
  state_path: ~/.hermes/state/model-router-usage.json
  # Load balancing, with Claude switched on: evens out the two accounts'
  # 5-hour windows. When a kind's first account is at busy_percent or more and the
  # next account in the same chain is at least margin_percent points freer, that
  # account goes first. The Opus parent counts on Claude's window, so Claude
  # usually leads and delegation leans to Codex. Only listed targets move; the
  # parent never does. window: 5-hour (default) or tighter (weekly or 5-hour);
  # the weekly window is otherwise left to the soft/hard limits below.
  balance:
    enabled: true
    window: 5-hour
    busy_percent: 20
    margin_percent: 10
  accounts:
    anthropic:
      soft_percent: 70
      hard_percent: 90
      step_down: {opus5: sonnet5}
    openai-codex:
      soft_percent: 70
      hard_percent: 90
      step_down: {sol: terra}
